[target.thumbv7neon-unknown-linux-gnueabihf]
linker = "clang-21"
rustflags = ["-Ctarget-feature=+v7,+neon,+vfp3,+thumb2,+thumb-mode"]

[target.armv7-sony-vita-newlibeabihf]
linker = "clang-21"

[target.aarch64-unknown-linux-gnu]
linker = "clang-21"
rustflags = ["-Clink-args=-fuse-ld=lld"]

# Target/sysroot/rtlib link args come from build.rs (cargo:rustc-link-arg) using the
# DSVITA_ANDROID_NDK env var — same convention as the armhf cross via DSVITA_SYSROOT.
[target.aarch64-linux-android]
linker = "clang-21"
rustflags = ["-Clink-args=-fuse-ld=lld"]

[unstable]
build-std = ["core", "alloc", "std", "panic_abort"]
